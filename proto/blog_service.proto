syntax = "proto3";

package blog;

// The blog post message type.
message Post {
  string id = 1;
  string title = 2;
  string author = 3;
  string content = 4;
  repeated string tags = 5;
  string published_date = 6;
}

// The response message containing the blog post ID.
message PostResponse {
  string id = 1;
}

// The response message containing a full blog post.
message FullPostResponse {
  Post post = 1;
}

// The response message containing all posts.
message AllPostsResponse {
  repeated Post posts = 1;
}

// Bounded, deterministic post-list query.
message ListPostsRequest {
  int64 limit = 1;
  int64 offset = 2;
  string author = 3;
  string tag = 4;
  string published_from = 5;
  string published_to = 6;
}

// The Blog service definition.
service BlogService {
  // Sends a new blog post.
  rpc AddPost(Post) returns (PostResponse);

  // Retrieves a blog post.
  rpc GetPost(PostResponse) returns (FullPostResponse);

  // Updates a blog post.
  rpc UpdatePost(Post) returns (PostResponse);

  // Deletes a blog post.
  rpc DeletePost(PostResponse) returns (PostResponse);

  // Retrieves all blog posts.
  rpc GetAllPosts(PostResponse) returns (AllPostsResponse);

  // Retrieves a filtered page sorted by published date and ID descending.
  rpc ListPosts(ListPostsRequest) returns (AllPostsResponse);
}
