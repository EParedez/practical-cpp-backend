name: CMake CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive
  MONGO_CXX_DRIVER_PREFIX: /home/runner/.local/mongo-cxx-driver
  LD_LIBRARY_PATH: /home/runner/.local/mongo-cxx-driver/lib

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Verify C++ formatting
        run: |
          find src tests -type f \( -name '*.cpp' -o -name '*.h' \) \
            ! -path 'src/server/httplib.h' -print0 \
            | xargs -0 clang-format --dry-run --Werror

  unit:
    name: Unit and strict build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake git libmongoc-dev libssl-dev \
            libgrpc++-dev protobuf-compiler-grpc libprotobuf-dev libgtest-dev
      - uses: actions/cache@v5
        with:
          path: /home/runner/.local/mongo-cxx-driver
          key: mongo-cxx-driver-4.5.0-${{ matrix.os }}-${{ runner.arch }}
      - name: Install MongoDB C++ Driver
        run: ./scripts/install_mongo_cxx_driver.sh
      - name: Configure with strict warnings
        run: >-
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_WARNINGS_AS_ERRORS=ON
          -DCMAKE_PREFIX_PATH="$MONGO_CXX_DRIVER_PREFIX"
      - name: Build
        run: cmake --build build --parallel 2
      - name: Run unit tests
        run: ctest --test-dir build -L unit --output-on-failure
      - name: Verify install rules
        run: cmake --install build --prefix "$RUNNER_TEMP/blog-install"

  integration:
    runs-on: ubuntu-24.04
    services:
      mongodb:
        image: mongo:8.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.adminCommand(\"ping\").ok ? 0 : 1)'"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake git libmongoc-dev libssl-dev \
            libgrpc++-dev protobuf-compiler-grpc libprotobuf-dev libgtest-dev
      - uses: actions/cache@v5
        with:
          path: /home/runner/.local/mongo-cxx-driver
          key: mongo-cxx-driver-4.5.0-ubuntu-24.04-${{ runner.arch }}
      - name: Install MongoDB C++ Driver
        run: ./scripts/install_mongo_cxx_driver.sh
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$MONGO_CXX_DRIVER_PREFIX"
          cmake --build build --parallel 2
      - name: Run integration tests
        run: ctest --test-dir build -L integration --output-on-failure --timeout 30

  sanitizer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang git libmongoc-dev libssl-dev \
            libgrpc++-dev protobuf-compiler-grpc libprotobuf-dev libgtest-dev
      - uses: actions/cache@v5
        with:
          path: /home/runner/.local/mongo-cxx-driver
          key: mongo-cxx-driver-4.5.0-ubuntu-24.04-${{ runner.arch }}
      - name: Install MongoDB C++ Driver
        run: ./scripts/install_mongo_cxx_driver.sh
      - name: Build with ASan and UBSan
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -B build -DENABLE_SANITIZERS=ON \
            -DCMAKE_PREFIX_PATH="$MONGO_CXX_DRIVER_PREFIX"
          cmake --build build --parallel 2
      - name: Run sanitized unit tests
        run: ctest --test-dir build -L unit --output-on-failure

  coverage-and-analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang-tidy git lcov libmongoc-dev libssl-dev \
            libgrpc++-dev protobuf-compiler-grpc libprotobuf-dev libgtest-dev
      - uses: actions/cache@v5
        with:
          path: /home/runner/.local/mongo-cxx-driver
          key: mongo-cxx-driver-4.5.0-ubuntu-24.04-${{ runner.arch }}
      - name: Install MongoDB C++ Driver
        run: ./scripts/install_mongo_cxx_driver.sh
      - name: Build with coverage and static analysis
        run: |
          cmake -B build -DENABLE_COVERAGE=ON \
            -DCMAKE_PREFIX_PATH="$MONGO_CXX_DRIVER_PREFIX" \
            -DCMAKE_CXX_CLANG_TIDY="clang-tidy"
          cmake --build build --parallel 2
      - name: Run unit tests and capture coverage
        run: |
          ctest --test-dir build -L unit --output-on-failure
          lcov --capture --directory build --output-file coverage.info \
            --ignore-errors mismatch
          lcov --remove coverage.info '/usr/*' '*/build/*' '*/tests/*' \
            --output-file coverage.info --ignore-errors unused
      - uses: actions/upload-artifact@v7
        with:
          name: cpp-coverage
          path: coverage.info

  container-smoke:
    runs-on: ubuntu-24.04
    needs: [unit, integration, sanitizer]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and smoke test without publishing
        run: ./scripts/smoke_test.sh

  container-platforms:
    name: Container (${{ matrix.platform }}, Ubuntu ${{ matrix.ubuntu-version }})
    runs-on: ubuntu-24.04
    needs: [unit]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            architecture: x86_64
            slug: ubuntu-24.04-amd64
            ubuntu-version: "24.04"
          - platform: linux/arm64
            architecture: aarch64
            slug: ubuntu-24.04-arm64
            ubuntu-version: "24.04"
          - platform: linux/amd64
            architecture: x86_64
            slug: ubuntu-22.04-amd64
            ubuntu-version: "22.04"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: UBUNTU_VERSION=${{ matrix.ubuntu-version }}
          load: true
          push: false
          tags: practical-cpp-backend:${{ matrix.slug }}
          cache-from: type=gha,scope=container-${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.slug }}
      - name: Verify platform and runtime linkage
        run: |
          docker run --rm --entrypoint /bin/sh \
            practical-cpp-backend:${{ matrix.slug }} -ec '
              test "$(uname -m)" = "${{ matrix.architecture }}"
              ! ldd /app/blog_http_server | grep -q "not found"
              ! ldd /app/blog_grpc_server | grep -q "not found"
            '
      - name: Scan platform image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: practical-cpp-backend:${{ matrix.slug }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v5

  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LOG_OPTS: --all
