# Continuous Integration & Testing (Chapter 9) for the blog backend.
name: C++ CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libmongoc-dev libmongocxx-dev \
            libgrpc++-dev protobuf-compiler-grpc libprotobuf-dev libgtest-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j2

      - name: Run unit tests
        run: ctest --test-dir build -L unit --output-on-failure

      - name: Run integration tests
        run: ctest --test-dir build -L integration --output-on-failure --timeout 20
