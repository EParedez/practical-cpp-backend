# Nginx reverse proxy configuration for the blog application.
# Proxies incoming HTTP traffic to the C++ HTTP server on port 8080.
# Based on the configuration presented in Chapter 8 of the book.

server {
    listen 80;
    server_name myblogapp.com www.myblogapp.com;

    location / {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # --- Security headers (Chapter 10) ---
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";
}
