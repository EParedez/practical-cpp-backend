# HTTPS configuration with SSL termination + rate limiting (Chapters 8 & 10).
# Requires valid SSL certificates. Generate self-signed ones for testing with:
#   openssl req -x509 -newkey rsa:4096 -keyout key.pem -out cert.pem -days 365 -nodes

http {
    # Rate limiting: max 10 requests/second per client IP.
    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;

    # HTTP -> HTTPS redirect.
    server {
        listen 80;
        listen [::]:80;
        server_name your_domain www.your_domain;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name your_domain www.your_domain;

        ssl_certificate /etc/ssl/certs/your_domain.pem;
        ssl_certificate_key /etc/ssl/private/your_domain.key;

        location /login {
            limit_req zone=mylimit burst=20 nodelay;
            proxy_pass http://localhost:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        location / {
            proxy_pass http://localhost:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-XSS-Protection "1; mode=block";
    }
}
