# Nginx load balancer configuration (round robin) from Chapter 8.
# Place this in /etc/nginx/nginx.conf (http block) when running
# multiple instances of the blog application on different hosts.

http {
    upstream backend {
        # Round-robin distribution by default.
        server backend1.myblogapp.com;
        server backend2.myblogapp.com;
        server backend3.myblogapp.com;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
